<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پخش‌کننده موسیقی | Hekmat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 30px;
            font-size: 2em;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .player-card {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            padding: 25px;
        }

        .cover {
            width: 150px;
            height: 150px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            border-radius: 50%;
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            animation: rotate 10s linear infinite;
            animation-play-state: paused;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .cover.playing {
            animation-play-state: running;
        }

        #songTitle {
            color: #fff;
            text-align: center;
            margin: 20px 0;
            font-size: 1.3em;
        }

        audio {
            width: 100%;
            margin: 20px 0;
            border-radius: 30px;
        }

        .upload-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            display: inline-block;
            margin: 10px 0;
            transition: transform 0.2s;
        }

        .upload-btn:hover {
            transform: scale(1.05);
        }

        #playlist {
            margin-top: 25px;
            max-height: 200px;
            overflow-y: auto;
        }

        #playlist h3 {
            color: #fff;
            margin-bottom: 15px;
        }

        .song-item {
            background: rgba(255, 255, 255, 0.1);
            margin: 8px 0;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .song-item:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(5px);
        }

        .delete-btn {
            background: rgba(255, 0, 0, 0.5);
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
        }

        .delete-btn:hover {
            background: rgba(255, 0, 0, 0.8);
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 پخش‌کننده حرفه‌ای 🎵</h1>
        <div class="player-card">
            <div class="cover" id="cover">🎧</div>
            <h2 id="songTitle">هیچ آهنگی انتخاب نشده</h2>
            
            <audio id="audioPlayer" controls></audio>
            
            <label for="uploadSong" class="upload-btn">📂 آپلود آهنگ جدید</label>
            <input type="file" id="uploadSong" accept=".mp3">
            
            <div id="playlist">
                <h3>📋 لیست پخش</h3>
                <div id="songList"></div>
            </div>
        </div>
    </div>

    <script>
        const audioPlayer = document.getElementById('audioPlayer');
        const songTitle = document.getElementById('songTitle');
        const songListDiv = document.getElementById('songList');
        const uploadInput = document.getElementById('uploadSong');
        const cover = document.getElementById('cover');

        let songs = [];

        // بارگذاری آهنگ‌های ذخیره شده
        function loadSongs() {
            const savedSongs = localStorage.getItem('hekmatSongs');
            if(savedSongs) {
                songs = JSON.parse(savedSongs);
                displaySongs();
            }
        }

        // ذخیره آهنگ‌ها
        function saveSongs() {
            localStorage.setItem('hekmatSongs', JSON.stringify(songs));
        }

        // نمایش لیست آهنگ‌ها
        function displaySongs() {
            if(songs.length === 0) {
                songListDiv.innerHTML = '<div style="color: #aaa; text-align: center;">هنوز آهنگی آپلود نشده<br>👆 روی دکمه بالا کلیک کن</div>';
                return;
            }
            
            songListDiv.innerHTML = '';
            songs.forEach((song, index) => {
                const songDiv = document.createElement('div');
                songDiv.className = 'song-item';
                songDiv.innerHTML = `
                    <span>🎵 ${song.name}</span>
                    <button class="delete-btn" data-index="${index}">🗑️</button>
                `;
                
                songDiv.querySelector('span').onclick = () => playSong(index);
                songDiv.querySelector('.delete-btn').onclick = (e) => {
                    e.stopPropagation();
                    deleteSong(index);
                };
                
                songListDiv.appendChild(songDiv);
            });
        }

        // پخش آهنگ
        function playSong(index) {
            const song = songs[index];
            if(song && song.url) {
                audioPlayer.src = song.url;
                songTitle.textContent = song.name;
                audioPlayer.play();
                cover.classList.add('playing');
            }
        }

        // حذف آهنگ
        function deleteSong(index) {
            if(confirm('آیا از حذف این آهنگ مطمئنی؟')) {
                songs.splice(index, 1);
                saveSongs();
                displaySongs();
                if(audioPlayer.src === songs[index]?.url) {
                    audioPlayer.src = '';
                    songTitle.textContent = 'هیچ آهنگی انتخاب نشده';
                    cover.classList.remove('playing');
                }
            }
        }

        // آپلود آهنگ جدید
        uploadInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(file && file.type === 'audio/mpeg') {
                const url = URL.createObjectURL(file);
                const songName = file.name.replace('.mp3', '').substring(0, 30);
                
                songs.push({
                    name: songName,
                    url: url
                });
                
                saveSongs();
                displaySongs();
                alert(`آهنگ "${songName}" با موفقیت اضافه شد!`);
                
                // پاک کردن input برای آپلود دوباره
                uploadInput.value = '';
            } else {
                alert('لطفاً فقط فایل MP3 انتخاب کن!');
            }
        });

        // انیمیشن کاور
        audioPlayer.addEventListener('play', () => {
            cover.classList.add('playing');
        });
        
        audioPlayer.addEventListener('pause', () => {
            cover.classList.remove('playing');
        });

        // شروع برنامه
        loadSongs();
    </script>
</body>
</html>
