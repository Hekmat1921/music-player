<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پیام‌رسان خفن | مرحله 0.1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #app {
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            backdrop-filter: blur(10px);
            max-width: 600px;
            width: 90%;
        }
        h1 {
            font-size: 2em;
            margin-bottom: 20px;
            color: #00d4ff;
        }
        .status {
            background: #0f3460;
            padding: 10px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 0.9em;
        }
        button {
            background: #00d4ff;
            color: #1a1a2e;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #00b4d8;
            transform: scale(1.05);
        }
        .progress {
            margin-top: 30px;
            font-size: 0.85em;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>🔥 پیام‌رسان هارق‌العاده</h1>
        <div class="status">
            ✅ مرحله 0.1: راه‌اندازی پروژه
            <br>
            ساختار اولیه آماده است.
        </div>
        <button onclick="nextStep()">ثبت مرحله 0.1 و درخواست مرحله 0.2</button>
        <div class="progress">
            فاز 0 / 3 | مرحله 1 از 28 مرحله
        </div>
    </div>

    <script>
        function nextStep() {
            alert('مرحله 0.1 تکمیل شد! حالا کد مرحله 0.2 رو از من بخواه.');
            console.log('مرحله 0.1 کامل - آماده برای مرحله 0.2');
        }
    </script>
</body>
</html>
