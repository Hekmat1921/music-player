<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>چت شیشه‌ای | Mirage iOS 27</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, 'SF Pro Display', system-ui, BlinkMacSystemFont, Helvetica, sans-serif;
            background: radial-gradient(circle at 20% 30%, #1e3c72, #0a0f1a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 80% 20%, rgba(255,255,255,0.08) 0%, transparent 50%),
                repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 8px);
            pointer-events: none;
            z-index: 0;
        }

        #app {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 600px;
            height: 85vh;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: 64px;
            border: 0.8px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3), 0 0 0 0.5px rgba(255, 255, 255, 0.1) inset;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* هدر */
        .chat-header {
            padding: 24px 24px 12px;
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(20px);
        }

        .chat-header h1 {
            font-size: 1.6rem;
            background: linear-gradient(135deg, #ffffff, #a0d0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 4px;
        }

        .connection-status {
            font-size: 0.7rem;
            color: #4ade80;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* پیام‌ها */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 20px 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 10px 16px;
            border-radius: 24px;
            font-size: 0.95rem;
            word-wrap: break-word;
            animation: fadeIn 0.2s ease;
        }

        .message.sent {
            background: rgba(0, 212, 255, 0.3);
            backdrop-filter: blur(10px);
            border: 0.5px solid rgba(0, 212, 255, 0.5);
            align-self: flex-end;
            border-bottom-right-radius: 6px;
            color: white;
        }

        .message.received {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 0.5px solid rgba(255, 255, 255, 0.25);
            align-self: flex-start;
            border-bottom-left-radius: 6px;
            color: rgba(255, 255, 255, 0.9);
        }

        .message-meta {
            font-size: 0.65rem;
            opacity: 0.6;
            margin-top: 4px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ورودی پیام */
        .input-area {
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(20px);
            border-top: 0.5px solid rgba(255, 255, 255, 0.15);
            display: flex;
            gap: 12px;
        }

        .input-area input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 0.5px solid rgba(255, 255, 255, 0.25);
            padding: 12px 18px;
            border-radius: 40px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: 0.2s;
        }

        .input-area input:focus {
            border-color: #00d4ff;
            background: rgba(255, 255, 255, 0.15);
        }

        .input-area button {
            background: rgba(0, 212, 255, 0.3);
            border: 0.5px solid rgba(0, 212, 255, 0.6);
            padding: 0 24px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .input-area button:hover {
            background: rgba(0, 212, 255, 0.5);
            transform: scale(0.96);
        }

        .glow-ring {
            position: absolute;
            top: 20%;
            left: -10%;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(0,212,255,0.2), transparent);
            border-radius: 50%;
            filter: blur(60px);
            z-index: 1;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="glow-ring"></div>
    <div class="glow-ring" style="bottom: -10%; top: auto; left: auto; right: -5%;"></div>

    <div id="app">
        <div class="chat-header">
            <h1>✨ Mirage Chat</h1>
            <div class="connection-status">
                <span class="status-dot"></span>
                <span id="connStatus">اتصال به سرور...</span>
            </div>
        </div>

        <div class="messages-container" id="messages">
            <div class="message received">
                به چت شیشه‌ای خوش آمدی ✨
                <div class="message-meta">سیستم</div>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="messageInput" placeholder="پیام بنویس... (متن)" autocomplete="off">
            <button id="sendBtn">📤 ارسال</button>
        </div>
    </div>

    <script>
        // اتصال به WebSocket عمومی (برای تست بدون بک‌اند)
        // استفاده از wss://echo.websocket.org (سرور echo برای تست)
        const WS_URL = 'wss://echo.websocket.org';
        let socket = null;
        let connected = false;

        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const connStatusSpan = document.getElementById('connStatus');

        function addMessage(text, type = 'received', sender = 'کاربر') {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}`;
            msgDiv.innerHTML = `
                ${text}
                <div class="message-meta">${sender} • ${new Date().toLocaleTimeString()}</div>
            `;
            messagesContainer.appendChild(msgDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function updateConnectionStatus(status, isConnected = false) {
            connected = isConnected;
            connStatusSpan.textContent = status;
            const dot = document.querySelector('.status-dot');
            if (dot) {
                dot.style.background = isConnected ? '#4ade80' : '#f87171';
            }
        }

        // اتصال WebSocket
        function connectWebSocket() {
            try {
                socket = new WebSocket(WS_URL);
                
                socket.onopen = () => {
                    updateConnectionStatus('متصل (Echo Server)', true);
                    addMessage('✅ اتصال به سرور برقرار شد. می‌تونی پیام بفرستی!', 'received', 'سیستم');
                };
                
                socket.onmessage = (event) => {
                    // سرور echo همون پیام رو برمی‌گردونه
                    addMessage(event.data, 'received', 'سمت دیگر');
                };
                
                socket.onerror = (error) => {
                    console.error('WebSocket error:', error);
                    updateConnectionStatus('خطا در اتصال', false);
                    addMessage('⚠️ خطا در اتصال به سرور', 'received', 'سیستم');
                };
                
                socket.onclose = () => {
                    updateConnectionStatus('قطع شد', false);
                    addMessage('🔌 اتصال قطع شد. صفحه رو refresh کن', 'received', 'سیستم');
                };
            } catch(e) {
                console.error(e);
                updateConnectionStatus('پشتیبانی نشد', false);
            }
        }

        // ارسال پیام
        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                addMessage('❌ اتصال به سرور برقرار نیست. منتظر بمان...', 'received', 'سیستم');
                return;
            }
            
            // نمایش پیام در سمت خودم (sent)
            addMessage(text, 'sent', 'شما');
            
            // ارسال به WebSocket
            socket.send(text);
            
            // پاک کردن اینپوت
            messageInput.value = '';
            messageInput.focus();
        }

        // رویدادها
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // شروع اتصال
        connectWebSocket();
    </script>
</body>
</html>
