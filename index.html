<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hekmat Music | پخش‌کننده حرفه‌ای موسیقی</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-animation">
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
    </div>
    
    <div class="container">
        <div class="glass-card">
            <div class="header">
                <h1 class="neon-text">🎵 HEKMAT MUSIC 🎵</h1>
                <p class="subtitle">حرفه‌ای‌ترین پخش‌کننده آنلاین</p>
            </div>
            
            <div class="player-wrapper">
                <div class="vinyl-record" id="vinyl">
                    <div class="vinyl-center"></div>
                    <div class="vinyl-grooves"></div>
                </div>
                
                <div class="controls">
                    <div class="song-info">
                        <h2 id="nowPlaying">هیچ آهنگی انتخاب نشده</h2>
                        <p id="artistName">Hekmat Music</p>
                    </div>
                    
                    <audio id="audioPlayer" preload="metadata"></audio>
                    
                    <div class="custom-controls">
                        <button id="prevBtn" class="control-btn">⏮</button>
                        <button id="playPauseBtn" class="control-btn play-btn">▶</button>
                        <button id="nextBtn" class="control-btn">⏭</button>
                    </div>
                    
                    <div class="progress-container">
                        <span id="currentTime">0:00</span>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <span id="duration">0:00</span>
                    </div>
                </div>
            </div>
            
            <div class="playlist-section">
                <div class="playlist-header">
                    <h3>📀 لیست پخش رسمی</h3>
                    <span id="songCount">0 آهنگ</span>
                </div>
                <div id="playlist" class="playlist"></div>
            </div>
            
            <div class="admin-note">
                <p>🎧 برای مدیر سایت: برای اضافه کردن آهنگ جدید، فایل MP3 رو توی پوشه "songs" آپلود کن</p>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
