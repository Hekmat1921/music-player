<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hekmat Music Pro | پخش‌کننده هوشمند موسیقی</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-animation">
        <div class="gradient-bg"></div>
    </div>

    <div class="app-container">
        <!-- هدر با سرچ -->
        <div class="header">
            <div class="logo">
                <h1 class="glitch" data-text="HEKMAT MUSIC">HEKMAT MUSIC</h1>
                <p>پخش‌کننده هوشمند نسل جدید</p>
            </div>
            
            <!-- باکس سرچ حرفه‌ای -->
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 جستجوی آهنگ... (حتی با یک تیکه از متن)">
                <div class="search-filters">
                    <button class="filter-btn active" data-filter="all">🎵 همه</button>
                    <button class="filter-btn" data-filter="persian">🇮🇷 فارسی</button>
                    <button class="filter-btn" data-filter="english">🇬🇧 انگلیسی</button>
                    <button class="filter-btn" data-filter="instrumental">🎹 بی کلام</button>
                </div>
            </div>
        </div>

        <!-- پلیر اصلی -->
        <div class="main-player">
            <div class="vinyl-container">
                <div class="vinyl-disc" id="vinylDisc">
                    <div class="vinyl-center"></div>
                </div>
                <div class="album-art" id="albumArt">
                    <img id="albumCover" src="https://via.placeholder.com/200" alt="cover">
                </div>
            </div>

            <div class="player-controls">
                <div class="now-playing">
                    <h2 id="songTitle">هیچ آهنگی انتخاب نشده</h2>
                    <p id="artistName">Hekmat Music</p>
                </div>

                <audio id="audioPlayer" preload="metadata"></audio>

                <div class="custom-controls">
                    <button class="ctrl-btn" id="shuffleBtn">🔀</button>
                    <button class="ctrl-btn" id="prevBtn">⏮</button>
                    <button class="ctrl-btn play-pause" id="playPauseBtn">▶</button>
                    <button class="ctrl-btn" id="nextBtn">⏭</button>
                    <button class="ctrl-btn" id="repeatBtn">🔁</button>
                </div>

                <div class="progress-area">
                    <span id="currentTime">0:00</span>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <span id="duration">0:00</span>
                </div>

                <!-- لینک‌های اجتماعی آهنگ -->
                <div class="song-links" id="songLinks">
                    <a href="#" class="social-link insta" target="_blank">📷 اینستاگرام</a>
                    <a href="#" class="social-link video" target="_blank">🎬 ویدیو موزیک</a>
                    <a href="#" class="social-link lyrics" target="_blank">📝 متن آهنگ</a>
                </div>
            </div>
        </div>

        <!-- لیست آهنگ‌ها با قابلیت سرچ -->
        <div class="playlist-container">
            <div class="playlist-header">
                <h3>📀 لیست پخش</h3>
                <div class="view-options">
                    <button id="gridView" class="view-btn active">🔲</button>
                    <button id="listView" class="view-btn">📋</button>
                </div>
            </div>
            <div id="playlist" class="playlist-grid"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
